apiVersion: batch/v1
kind: Job
metadata:
  name: retail-bootstrap
  namespace: retail-evolve
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: bootstrap
        image: retail-evolve:local
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - app.bootstrap
        envFrom:
        - configMapRef:
            name: retail-config
        - secretRef:
            name: retail-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
