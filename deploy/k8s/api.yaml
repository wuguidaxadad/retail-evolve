apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: retail-evolve
spec:
  selector:
    app: api
  ports:
  - port: 8765
    targetPort: 8765
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: retail-evolve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: api
        image: retail-evolve:local
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: retail-config
        - secretRef:
            name: retail-secrets
        ports:
        - containerPort: 8765
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 8765
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/live
            port: 8765
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /api/live
            port: 8765
          periodSeconds: 5
          failureThreshold: 60
